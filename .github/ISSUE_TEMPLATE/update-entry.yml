name: Report outdated info
description: A fee, seller country or link in the list is wrong or out of date
title: "Update: <provider name>"
labels: ["outdated"]
body:
  - type: input
    id: provider
    attributes:
      label: Provider name
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed?
      description: What the list says now, and what the provider's page says.
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Seller country affected (if this is about where sellers can be based)
  - type: input
    id: source
    attributes:
      label: Source URL
      description: The provider's page where you saw the current info.
