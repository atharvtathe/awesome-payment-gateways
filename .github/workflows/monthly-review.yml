name: Monthly fee check

on:
  schedule:
    - cron: "0 9 1 * *" # 1st of every month, 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open the monthly review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          MONTH="$(date -u +'%B %Y')"
          gh issue create \
            --title "Monthly fee check: $MONTH" \
            --label outdated \
            --body "Time for the monthly check. For each provider, open its pricing and country pages and compare them with the list.

          - [ ] Merchant of Record Platforms: fees, sell-from countries, payouts
          - [ ] Country table: Stripe, Paddle, Lemon Squeezy, Polar, Creem, Dodo
          - [ ] Global Payment Gateways
          - [ ] Local Payment Gateways
          - [ ] Receive Your Payouts and US company services
          - [ ] Country guides in \`countries/\`
          - [ ] Update **Verified** on every row you checked
          - [ ] Add anything that changed to CHANGELOG.md
          - [ ] Update **Last full review** at the top of the README"
