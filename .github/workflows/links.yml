name: Check links

on:
  pull_request:
    paths: ["README.md", "countries/**"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Many ad pages block bots (403/429/999), so treat those as "alive".
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200..=299,403,429,999
            README.md countries/*.md
          fail: ${{ github.event_name == 'pull_request' }}

      - name: Open an issue on scheduled failures
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: outdated
